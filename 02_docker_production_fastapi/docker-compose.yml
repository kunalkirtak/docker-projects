services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker-production-fastapi:latest
    container_name: docker-production-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATA_FILE: /app/data/items.json
    volumes:
      - app_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  app_data:
    driver: local
