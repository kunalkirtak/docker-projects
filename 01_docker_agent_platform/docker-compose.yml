services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      POSTGRES_USER: ${POSTGRES_USER:-agentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpassword_dev_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - agent_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentuser} -d ${POSTGRES_DB:-agentdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not exposed to the host: only other containers on agent_network
    # need to reach PostgreSQL directly.

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - agent_network
    ports:
      # Exposed to the host only for local learning/debugging of the
      # Qdrant dashboard/API. Not required for the services to talk to
      # each other, since they use the "qdrant" service name internally.
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      POSTGRES_USER: ${POSTGRES_USER:-agentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpassword_dev_only}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - agent_network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not exposed to the host: only the agent service talks to the worker.

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-agent_knowledge}
      WORKER_SERVICE_HOST: worker
      WORKER_SERVICE_PORT: 8002
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - agent_network
    depends_on:
      qdrant:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # Not exposed to the host: only the api service talks to the agent.

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      APP_NAME: ${APP_NAME:-docker-agent-platform-api}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agentdb}
      POSTGRES_USER: ${POSTGRES_USER:-agentuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentpassword_dev_only}
      AGENT_SERVICE_HOST: agent
      AGENT_SERVICE_PORT: 8001
    networks:
      - agent_network
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

networks:
  agent_network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
